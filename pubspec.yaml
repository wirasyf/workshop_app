name: spareart_app
description: "Aplikasi Manajemen Toko Spare Part Motor"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Local Database (Drift/SQLite)
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # Cloud Backend
  supabase_flutter: ^2.8.2

  # Barcode Scanner
  mobile_scanner: ^6.0.2

  # Charts
  fl_chart: ^0.70.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  path: ^1.9.0
  connectivity_plus: ^6.1.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  shared_preferences: ^2.3.4
  csv: ^8.0.0
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^2.6.3
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
