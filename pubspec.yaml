name: dnd_markasban_app
description: "Aplikasi Manajemen Toko Spare Part Motor"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^17.2.3

  # Cloud Backend (Firebase)
  firebase_core: ^3.9.0
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0
  firebase_storage: ^12.3.2

  # Barcode Scanner
  mobile_scanner: ^7.2.0

  # Charts
  fl_chart: ^1.2.0

  # Utils
  flutter_screenutil: ^5.9.0
  intl: ^0.20.2
  uuid: ^4.5.1
  path: ^1.9.0
  connectivity_plus: ^7.1.1
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_local_notifications: ^21.0.0
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  shared_preferences: ^2.3.4
  csv: ^8.0.0
  excel: ^4.0.6
  share_plus: ^13.1.0
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.6
  googleapis_auth: ^1.6.0
  http: ^1.2.0

  # Bluetooth Thermal Printer
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.10
  riverpod_generator: ^2.3.5
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
